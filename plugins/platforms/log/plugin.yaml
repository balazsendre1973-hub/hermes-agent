name: log-platform
label: log
kind: platform
version: 0.1.0
description: >
  Log csatorna kézbesítési platform a cron jobok számára.
  A szöveges kimenet a LOG_TELEGRAM_TOKEN mögötti Telegram bot privát
  chatjába (chat_id 8832329921 = Endre Balázs DM = Log csatorna) kerül.
  LLM-mentes, kikerülő (standalone) küldő: nincs hozzá live adapter, a
  magkódot nem módosítja (LiveUpdate-biztos).
author: coder (Hermes agent) + Endre Balázs
requires_env:
  - name: LOG_TELEGRAM_TOKEN
    description: "A Log csatorna Telegram bot tokena a cron kézbesítéshez"
    prompt: "Log Telegram bot token"
    password: true
